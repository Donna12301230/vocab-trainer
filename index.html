<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字練習</title>
<meta name="description" content="多益單字閃卡、標記不熟、今日複習與考試">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="單字練習">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#efede6; --text:#1d2025; --muted:#6a6e75; --line:#e2dfd6;
  --accent:#2b5fd9; --accent-2:#1e4bb8; --accent-ink:#ffffff; --accent-soft:#e7eefc;
  --star:#c97a00; --star-soft:#fff1d6;
  --ok:#17874a; --ok-soft:#e1f5e8; --bad:#cf3b3b; --bad-soft:#fde6e6;
  --shadow:0 1px 2px rgba(20,20,30,.05), 0 6px 18px rgba(20,20,30,.06);
  --radius:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --surface:#1d1f24; --surface-2:#272a30; --text:#e9eaec; --muted:#9a9ea6; --line:#30333a;
    --accent:#7aa2ff; --accent-2:#94b5ff; --accent-ink:#0d1220; --accent-soft:#1f2a44;
    --star:#ffb43d; --star-soft:#3a2d14;
    --ok:#4cc77f; --ok-soft:#173726; --bad:#ff6b6b; --bad-soft:#3d1c1e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1d1f24; --surface-2:#272a30; --text:#e9eaec; --muted:#9a9ea6; --line:#30333a;
  --accent:#7aa2ff; --accent-2:#94b5ff; --accent-ink:#0d1220; --accent-soft:#1f2a44;
  --star:#ffb43d; --star-soft:#3a2d14;
  --ok:#4cc77f; --ok-soft:#173726; --bad:#ff6b6b; --bad-soft:#3d1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-top:20px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.okc{color:var(--ok)} .badc{color:var(--bad)} .starc{color:var(--star)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--text);white-space:nowrap;min-width:0}
.brand .logo{font-weight:700}
.brand .logo b{color:var(--accent)}
.brand .bank-name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:200px}
nav{display:flex;gap:2px;flex:none}
nav a{padding:7px 12px;border-radius:999px;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:5px;white-space:nowrap}
nav a:hover{background:var(--surface-2);color:var(--text)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{background:var(--star);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px;min-width:18px;text-align:center;font-weight:700}
.store-warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;font-size:15px;line-height:1.3;transition:background .15s,border-color .15s,transform .05s;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.star{background:var(--star-soft);border-color:transparent;color:var(--star)}
.btn.star:hover{border-color:var(--star)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.ok:hover{border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.bad:hover{border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;border-color:transparent;color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.big{padding:14px 20px;font-size:17px;flex:1}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib.say{color:var(--accent)}
.ib.lg{width:54px;height:54px;border-radius:50%;background:var(--accent-soft)}
.ib.lg svg{width:26px;height:26px}
.ib.sm{width:28px;height:28px}
.ib.sm svg{width:16px;height:16px}
.ib.star path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.ib.star.on{color:var(--star)}
.ib.star.on path{fill:currentColor}

/* form controls */
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;max-width:100%}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;outline:none}
textarea{font-family:Consolas,ui-monospace,"Microsoft JhengHei",monospace;font-size:14px;resize:vertical;min-height:150px;tab-size:14;line-height:1.5}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* home */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hero-top > div{min-width:0}
.hero h1{margin:0;font-size:25px;line-height:1.3;text-wrap:balance}
.hero p{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.stat b{font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;color:var(--muted);font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.stat.star b{color:var(--star)}
.daily{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--star);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.daily.complete{border-left-color:var(--ok)}
.daily-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.daily h3{margin:0;font-size:18px}
.streak{font-size:14px;font-weight:600;color:var(--star)}
.daily .progress{margin:10px 0 4px}
.daily .actions{margin:12px 0 0}
.daily-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wchip{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.wchip.done{background:var(--ok-soft);color:var(--ok)}
.search{margin-bottom:14px}
.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.gcard{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-height:116px;color:var(--text);transition:border-color .15s,transform .15s,box-shadow .15s}
.gcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gnum{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.gcard.done .gnum{color:var(--ok)}
.grange{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gname{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.gprev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.star{background:var(--star-soft);color:var(--star)}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:2px;padding:9px 12px 9px 6px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.starred{background:var(--star-soft);background:color-mix(in srgb,var(--star-soft) 55%,transparent)}
.rbody{flex:1;min-width:0;padding:5px 0 0 4px}
.rhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.w{font-weight:700;font-size:17px;word-break:break-word}
.pos{font-size:12.5px;color:var(--muted);font-style:italic}
.zh{font-size:15px}
.def{font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--accent);margin-top:2px}
.rank{font-size:12px;color:var(--muted);padding-top:9px;font-variant-numeric:tabular-nums}
.rbody.mask .zh,.rbody.mask .def{filter:blur(6px);user-select:none;cursor:pointer;transition:filter .15s}
.rbody.mask.shown .zh,.rbody.mask.shown .def{filter:none}
.gbadge{font-size:12px;background:var(--surface-2);padding:0 7px;border-radius:999px;color:var(--muted)}
.miss{font-size:12px;color:var(--bad);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* group page */
.crumb{margin-bottom:6px;font-size:14px}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:24px;line-height:1.3;text-wrap:balance}
h3{font-size:16px}
.ghead p{margin:2px 0 0;font-size:14px}
.gnav{display:flex;gap:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.actions.center{justify-content:center}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.opts-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;max-width:100%}
.seg.seg-wrap{flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* study */
.sbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:8px}
.stitle{text-align:center;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.scount{font-variant-numeric:tabular-nums;font-weight:700}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.daily .progress i{background:var(--star)}
.daily.complete .progress i{background:var(--ok)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:min(50vh,340px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 20px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none;-webkit-tap-highlight-color:transparent}
.card:focus-visible{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.card.flipped{border-color:var(--accent)}
.face{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .18s ease;max-width:100%}
@keyframes pop{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.c-word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,9vw,56px);font-weight:700;line-height:1.15;word-break:break-word}
.c-word.sm{font-size:clamp(26px,6vw,36px);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.c-pos{color:var(--muted);font-style:italic}
.c-zh{font-size:clamp(22px,5vw,30px);font-weight:700}
.c-zh.big{font-size:clamp(26px,7vw,40px)}
.c-def{color:var(--muted);max-width:560px;font-size:15px}
.c-note{color:var(--accent);font-size:13px;max-width:560px}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:13px;color:var(--muted)}
.card-star{position:absolute;top:14px;right:16px;color:var(--star);font-size:12px;display:flex;align-items:center;gap:3px;font-weight:600}
.card-star path{fill:currentColor}
.sbtns{display:flex;gap:12px;margin-top:16px}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
@media (hover:none){.kbd-hint{display:none}}
.done-card{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.done-card .big-mark{font-size:44px;line-height:1}
.done-card h2{margin:10px 0 4px}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;width:48px;text-align:center;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;position:relative;font-size:15px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.wide{width:auto;padding:6px 12px;font-size:14px}
.chip.star-chip.on{background:var(--star);border-color:var(--star);color:#fff}
.chip.done::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.startbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.startbar .btn.big{flex:0 1 auto;min-width:220px}
.tablewrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.hist th{color:var(--muted);font-weight:600;border-top:0}
.hist.prev td{white-space:normal;min-width:60px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px;min-height:190px;justify-content:center}
.q-label{font-size:13px;color:var(--muted);font-weight:600}
.q-word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,8vw,46px);font-weight:700;line-height:1.15;word-break:break-word}
.q-pos{color:var(--muted);font-style:italic}
.q-zh{font-size:clamp(22px,6vw,32px);font-weight:700}
.listen-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:18px 30px;cursor:pointer;font-weight:600;font-size:14px}
.listen-btn svg{width:44px;height:44px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;min-height:58px;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default;color:var(--text)}
.opt kbd{flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:var(--muted)}
.opt.en{font-family:Georgia,"Times New Roman",serif;font-size:18px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.o-sub{display:block;font-size:13px;color:var(--muted);font-family:"Segoe UI",system-ui,"Microsoft JhengHei",sans-serif}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb-title{font-weight:700;margin-bottom:4px}
.fb.ok .fb-title{color:var(--ok)}
.fb.bad .fb-title{color:var(--bad)}
.fb-word{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px}
.fb .btn{margin-top:12px;width:100%}
.spell{display:flex;gap:8px;width:100%;max-width:440px}
.spell input{flex:1;min-width:0;padding:11px 14px;font-size:20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);outline:none;text-align:center;font-family:Georgia,"Times New Roman",serif}
.spell input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spell-hint{font-family:Consolas,ui-monospace,monospace;font-size:20px;letter-spacing:1px;word-break:break-all}
.spell-more{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.spell-res{font-size:16px}
.spell-res b{font-family:Georgia,"Times New Roman",serif;font-size:20px}
.spell-res.ok b{color:var(--ok)}
.spell-res.bad b{color:var(--bad);text-decoration:line-through}
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.result h2{margin:0}
.result p{margin:6px 0}
.ring{--p:0;width:132px;height:132px;border-radius:50%;margin:0 auto 12px;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:106px;height:106px;border-radius:50%;background:var(--surface);display:flex;align-items:baseline;justify-content:center;padding-top:30px;font-size:38px;font-weight:800;line-height:1}
.ring small{font-size:15px;font-weight:600;margin-left:2px;color:var(--muted)}

/* banks & settings */
.banks{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px}
.bank{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;flex-wrap:wrap}
.bank.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bank-main{min-width:0;flex:1 1 220px}
.bank-title{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bank-act{display:flex;gap:6px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:14px;min-width:0}
.field select{font-size:15px;padding:9px 10px}
.field input[type=range]{width:100%;max-width:360px;accent-color:var(--accent)}
.panel .check{display:flex;margin:8px 0}
.warn{background:var(--star-soft);padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 12px}
.okline{margin:4px 0 8px}
.help{margin-top:12px;font-size:14px}
.help summary{cursor:pointer;color:var(--accent);font-weight:600}
.help pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);padding:10px;border-radius:8px;font-size:12.5px;margin:8px 0 0}
.help ul{padding-left:20px;margin:8px 0}
.help li{margin:3px 0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.keys dt{font-weight:600}
.keys dd{margin:0;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin-top:24px;line-height:1.6}

/* cloud sync */
.sync-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.sync-line a{font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync-dot.synced{background:var(--ok)}
.sync-dot.syncing,.sync-dot.loading{background:var(--accent);animation:blink 1s ease-in-out infinite}
.sync-dot.offline,.sync-dot.signedOut{background:var(--star)}
.sync-dot.error{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.sync-user{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-width:0}
.sync-user img{width:36px;height:36px;border-radius:50%;flex:none}
.sync-user div{min-width:0;overflow-wrap:anywhere}
.sync-err{color:var(--bad);font-size:14px;margin:8px 0 0}
.btn.google{background:var(--surface);border-color:var(--line);gap:10px}
.btn.google svg{width:18px;height:18px}

@media (max-width:560px){
  .brand .bank-name{display:none}
  nav a{padding:6px 9px;font-size:14px}
  .hero{padding:16px}
  .hero h1{font-size:21px}
  .stat{padding:8px 10px}
  .stat b{font-size:20px}
  .ggrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gcard{min-height:106px;padding:11px 12px}
  h2{font-size:21px}
  .btn.big{padding:13px 12px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .startbar .btn.big{width:100%;flex:1 1 100%}
  .card{padding:34px 14px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

const KEY = 'vocab-trainer-v2';
const OLD_KEY = 'tsl12-trainer-v1';
const BKEY = 'vocab-banks-v1';
function bankDefaults(){
  return {star:{}, miss:{}, rv:{}, done:{}, last:{}, hist:[], daily:null, dailyLog:{}, qsGroups:[1], qsStar:false};
}
function defaults(){
  return {cur:BUILTIN[0].id, banks:{},
    set:{voice:'', rate:0.9, autoSpeak:true, quizSpeak:true, shuffle:false, front:'en', hideZh:false,
         dailyN:10, qsType:'en2zh', qsCount:20}};
}
function mergeState(s){
  const d = defaults();
  if (!s || typeof s !== 'object') return d;
  if (s.star && !s.banks) {
    // 舊版（只有 TSL）的進度格式
    const b = bankDefaults();
    ['star','miss','rv','done','last','hist','daily','dailyLog'].forEach(k => { if (s[k] != null) b[k] = s[k]; });
    if (s.set && Array.isArray(s.set.qsGroups)) b.qsGroups = s.set.qsGroups;
    if (s.set && 'qsStar' in s.set) b.qsStar = !!s.set.qsStar;
    d.banks[BUILTIN[0].id] = b;
    Object.assign(d.set, s.set || {});
    return d;
  }
  return Object.assign(d, s, {set:Object.assign(d.set, s.set || {}), banks:(s.banks && typeof s.banks === 'object') ? s.banks : {}});
}
let canStore = true;
try { localStorage.setItem('__vt_t', '1'); localStorage.removeItem('__vt_t'); } catch (e) { canStore = false; }
function loadState(){
  try {
    const cur = localStorage.getItem(KEY);
    if (cur) return mergeState(JSON.parse(cur));
    const old = localStorage.getItem(OLD_KEY);
    if (old) return mergeState(JSON.parse(old));
  } catch (e) {}
  return defaults();
}
function loadCustom(){

    const a = JSON.parse(localStorage.getItem(BKEY) || '[]');
    return Array.isArray(a) ? a.filter(b => b && b.id && b.name && Array.isArray(b.words)) : [];
  } catch (e) { return []; }
}

/* ---------- 目前使用的單字庫 ---------- */
let B, P, WORDS, BY_ID, NG, GW, POS_POOL, POS_EXACT;
let session = null;
let pendingSpeak = null;
let lastKey = '';
let groupFilter = 'all';
let reviewSort = 'rank';
let reviewGroup = 0;

function useBank(id){
  const def = allBanks().find(b => b.id === id) || allBanks()[0];
  const size = def.size || 50;
  // 有 groups 的單字庫依主題分組，否則每 size 個字一組
  const named = Array.isArray(def.groups) && def.groups.length ? def.groups : null;
  const gOf = [];
  if (named) named.forEach((g, gi) => { for (let k = 0; k < g.n; k++) gOf.push(gi + 1); });
  // 內建單字庫可以提供固定編號（ids），之後在中間插入新字也不會讓進度錯位
  const ids = Array.isArray(def.ids) && def.ids.length === def.words.length ? def.ids : null;
  WORDS = def.words.map((r, i) => ({id:ids ? ids[i] : i + 1, w:String(r[0]), pos:r[1] || '', zh:r[2] || '', def:r[3] || '', note:r[4] || '',
                                    g:named ? (gOf[i] || named.length) : Math.floor(i / size) + 1}));
  BY_ID = new Map(WORDS.map(x => [x.id, x]));
  NG = named ? named.length : Math.ceil(WORDS.length / size);
  GW = Array.from({length:NG + 1}, () => []);
  WORDS.forEach(w => GW[w.g].push(w));
  POS_POOL = {}; POS_EXACT = {};
  WORDS.forEach(w => {
    const p = w.pos.split('/')[0] || '?';
    (POS_POOL[p] = POS_POOL[p] || []).push(w);
    (POS_EXACT[w.pos] = POS_EXACT[w.pos] || []).push(w);
  });
  B = {id:def.id, name:def.name, size, builtin:!!def.builtin, source:def.source || '', credit:def.credit || '',
       gnames:named ? [''].concat(named.map(g => g.name)) : null};
  S.cur = def.id;
  P = S.banks[def.id] = Object.assign(bankDefaults(), S.banks[def.id] || {});
  P.qsGroups = (P.qsGroups || []).filter(g => g >= 1 && g <= NG);
  session = null; groupFilter = 'all'; reviewGroup = 0;
  const bb = $('#brandBank'); if (bb) bb.textContent = B.name;
}

function pickDaily(exclude, n){
  const ex = new Set(exclude);
  const cand = starIds().filter(id => !ex.has(id));
  // 最久沒複習的優先，其次錯最多次的
  cand.sort((a, b) => (P.rv[a] || 0) - (P.rv[b] || 0) || (P.miss[b] || 0) - (P.miss[a] || 0) || a - b);
  return cand.slice(0, n);
}
function ensureDaily(){
  const t = today();
  const N = S.set.dailyN || 10;
  if (!P.daily || P.daily.date !== t) {
    P.daily = {date:t, ids:pickDaily([], N), done:[]};
    save();
  } else {
    P.daily.ids = P.daily.ids.filter(id => BY_ID.has(id));
    if (P.daily.ids.length < N) {
      const more = pickDaily(P.daily.ids, N - P.daily.ids.length);
      if (more.length) { P.daily.ids.push(...more); save(); }
    }
  }
  return P.daily;
}
function dailyLeft(){ const d = ensureDaily(); return d.ids.filter(id => !d.done.includes(id)); }
function dailyComplete(){ const d = ensureDaily(); return d.ids.length > 0 && d.ids.every(id => d.done.includes(id)); }
function streak(){
  let n = 0; const d = new Date();
  if (!P.dailyLog[dayStr(d)]) d.setDate(d.getDate() - 1);
  while (P.dailyLog[dayStr(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

const TTS = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [], cur: null,
  load(){
    if (!this.ok) return;
    const isUS = v => /^en[-_]US$/i.test(v.lang);
    this.voices = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang))
      .sort((a, b) => (isUS(b) - isUS(a)) || a.name.localeCompare(b.name));
  },
  score(v){
    let s = 0;
    if (/^en[-_]US$/i.test(v.lang)) s += 10; else if (/^en[-_]GB$/i.test(v.lang)) s += 6;
    if (/natural/i.test(v.name)) s += 20;
    if (/google/i.test(v.name)) s += 14;
    if (/(enhanced|premium)/i.test(v.name)) s += 8;
    if (/(ava|aria|jenny|emma|andrew|guy|samantha)/i.test(v.name)) s += 3;
    return s;
  },
  pick(localOnly){
    let vs = this.voices;
    if (localOnly) vs = vs.filter(v => v.localService);
    if (!localOnly && S.set.voice) { const v = vs.find(v => v.voiceURI === S.set.voice); if (v) return v; }
    let best = null, bs = -1;
    for (const v of vs) { const s = this.score(v); if (s > bs) { bs = s; best = v; } }
    return best;
  },
  say(text, retry){
    if (!this.ok || !text) return;
    const syn = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance(text);
    const v = this.pick(!!retry);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = S.set.rate || 0.9;
    u.onerror = ev => {
      // 線上語音（例如沒網路時）失敗，改用本機語音再唸一次
      if (!retry && v && !v.localService && ev.error !== 'interrupted' && ev.error !== 'canceled') this.say(text, true);
    };
    this.cur = u;
    const run = () => { try { syn.resume(); } catch (e) {} syn.speak(u); };
    if (syn.speaking || syn.pending) { syn.cancel(); setTimeout(run, 60); } else run();
  }
};
TTS.load();
if (TTS.ok) {
  const onV = () => { TTS.load(); if (route().a === 'settings') render(); };
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', onV);
  else speechSynthesis.onvoiceschanged = onV;
  // iPhone 需要在第一次點擊時「解鎖」語音
  const unlock = () => {
    document.removeEventListener('click', unlock, true);
    try { if (!speechSynthesis.speaking) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  };
  document.addEventListener('click', unlock, true);
}

// 兩台裝置都改過同一個單字庫的進度時，把兩邊合併（不熟標記取聯集、次數取最大）
function mergeProgress(a, b){
  a = a || {}; b = b || {};
  const maxMap = (x, y) => { const o = Object.assign({}, x || {}); for (const k in (y || {})) o[k] = Math.max(o[k] || 0, y[k] || 0); return o; };
  const out = Object.assign({}, a, b);
  out.star = maxMap(a.star, b.star);
  out.miss = maxMap(a.miss, b.miss);
  out.rv = maxMap(a.rv, b.rv);
  out.done = maxMap(a.done, b.done);
  out.last = Object.assign({}, a.last || {}, b.last || {});
  const seen = new Set();
  out.hist = [...(b.hist || []), ...(a.hist || [])]
    .filter(h => h && h.t && !seen.has(h.t) && seen.add(h.t))
    .sort((x, y) => y.t - x.t).slice(0, 100);
  out.dailyLog = Object.assign({}, a.dailyLog || {}, b.dailyLog || {});
  const da = a.daily, db = b.daily;
  if (da && db && da.date === db.date) {
    out.daily = {date:da.date, ids:[...new Set([...(db.ids || []), ...(da.ids || [])])], done:[...new Set([...(db.done || []), ...(da.done || [])])]};
  } else {
    out.daily = (!da ? db : !db ? da : (da.date > db.date ? da : db)) || null;
  }
  return out;
}
// 決定一個資料單位要上傳、下載還是合併
// localJson：本機內容（null = 沒有或已刪除）；localUpdated：本機最後修改時間；synced：上次同步時的版本
// remote：雲端文件 {json, updated, deleted}，沒有則為 null
function decideSync(localJson, localUpdated, synced, remote){
  synced = synced || 0; localUpdated = localUpdated || 0;
  if (!remote) return localJson != null ? 'push' : 'none';
  const rJson = remote.deleted ? null : remote.json;
  if (rJson === localJson) return 'same';
  if (remote.updated === localUpdated) return 'same';
  const localChanged = localUpdated > synced;
  const remoteChanged = remote.updated > synced;
  if (remoteChanged && !localChanged) return 'pull';
  if (localChanged && !remoteChanged) return 'push';
  if (!localChanged && !remoteChanged) return 'none';
  return 'merge';
}
// 衝突時的結果：刪除優先；進度合併；設定與單字庫內容以雲端為準
function resolveConflict(key, localJson, remote){
  const rJson = remote.deleted ? null : remote.json;
  if ((key.startsWith('p_') || key.startsWith('b_')) && (localJson == null || rJson == null)) return null;
  if (key.startsWith('p_')) return JSON.stringify(mergeProgress(JSON.parse(localJson), JSON.parse(rJson)));
  return rJson;
}
function hashStr(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = (Math.imul(h, 33) + s.charCodeAt(i)) | 0; return (h >>> 0) || 1; }
/* SYNC-CORE-END */

    <div class="sync-user">${u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<div><b>${esc(u.displayName || '')}</b><div class="muted small">${esc(u.email || '')}</div></div></div>
    <div class="sync-line"><span class="sync-dot ${st}" data-sync-dot></span><span data-sync-text>${Sync.statusText()}</span><span data-sync-time>${Sync.meta.lastSync ? '最後同步：' + fmtDate(Sync.meta.lastSync) : ''}</span></div>

/* ---------- 路由 ---------- */
const APP = $('#app');
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  return {a: a || 'home', b};
}
function go(h){ if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);

function render(){
  const r = route();
  const key = r.a + '/' + (r.b || '');
  if (Sync.pendingRefresh && r.a !== 'study' && r.a !== 'test') {
    // 背單字或考試時收到其他裝置的更新，現在才套用到畫面
    Sync.pendingRefresh = false;
    useBank(allBanks().some(b => b.id === S.cur) ? S.cur : BUILTIN[0].id);
  }
  let html;
  switch (r.a) {
    case 'group': {
      const g = +r.b;
      if (!(g >= 1 && g <= NG)) { go('#/'); return; }
      html = viewGroup(g); break;
    }
    case 'review': html = viewReview(); break;
    case 'quiz': html = viewQuizSetup(); break;
    case 'settings': html = viewSettings(); break;
    case 'banks': html = viewBanks(); break;
    case 'study':
      if (!session || session.kind !== 'study') { go('#/'); return; }
      html = viewStudy(); break;
    case 'test':
      if (!session || session.kind !== 'quiz') { go('#/quiz'); return; }
      html = viewQuiz(); break;
    default: html = viewHome();
  }
  APP.innerHTML = (canStore ? '' : '<div class="store-warn">瀏覽器目前不允許儲存資料，關掉頁面後進度不會保留。請確認不是無痕視窗。</div>') + html;
  if (key !== lastKey) { window.scrollTo(0, 0); lastKey = key; }
  updateNav(r.a);
  if (pendingSpeak) { const t = pendingSpeak; pendingSpeak = null; TTS.say(t); }
  const si = document.getElementById('spellIn');
  if (si) si.focus({preventScroll:true});
}

function updateNav(a){
  const map = {home:'home', group:'home', study:'home', banks:'home', review:'review', quiz:'quiz', test:'quiz', settings:'settings'};
  const on = map[a] || 'home';
  document.querySelectorAll('[data-nav]').forEach(x => x.classList.toggle('on', x.dataset.nav === on));
  updateCounts();
}
function updateCounts(){
  const n = starIds().length;
  const b = $('#starBadge'); b.textContent = n; b.hidden = !n;
  document.querySelectorAll('[data-starcount]').forEach(el => {
    const v = el.dataset.starcount;
    const c = v === 'all' ? n : GW[+v].filter(w => isStar(w.id)).length;
    el.textContent = c;
    const btn = el.closest('button');
    if (btn) btn.disabled = !c;
  });
}

/* ---------- 閃卡 ---------- */
const curWord = () => BY_ID.get(session.list[session.i]);
function startStudy(ids, title, back, opt){
  opt = opt || {};
  if (!ids.length) return;
  const list = S.set.shuffle ? shuffle(ids) : [...ids];
  session = {kind:'study', all:[...ids], list, i:0, flipped:false, waitNext:false, res:{}, hist:[],
             title, base:opt.base || title, back, g:opt.g || null, full:!!opt.full, daily:!!opt.daily};
  if (S.set.front === 'en' && S.set.autoSpeak) pendingSpeak = BY_ID.get(list[0]).w;
  go('#/study');
}
function studyFlip(){
  const s = session;
  if (!s || s.i >= s.list.length) return;
  if (s.waitNext) { studyAdvance(); return; }
  s.flipped = !s.flipped;
  if (s.flipped && S.set.front === 'zh' && S.set.autoSpeak) pendingSpeak = curWord().w;
  render();
}
function studyAdvance(){
  const s = session;
  s.i++; s.flipped = false; s.waitNext = false;
  if (s.i >= s.list.length) {
    if (s.full && s.g) P.done[s.g] = Date.now();
    if (s.daily && dailyComplete()) P.dailyLog[today()] = true;
    save();
  } else if (S.set.front === 'en' && S.set.autoSpeak) {
    pendingSpeak = curWord().w;
  }
  render();
}
function studyMark(kind){
  const s = session;
  if (!s || s.i >= s.list.length) return;
  if (s.waitNext) { studyAdvance(); return; }
  const id = s.list[s.i];
  const d = s.daily ? ensureDaily() : null;
  s.hist.push({i:s.i, id, star:P.star[id], miss:P.miss[id], rv:P.rv[id], res:s.res[id], dailyDone: d ? d.done.includes(id) : null});
  if (d && !d.done.includes(id)) d.done.push(id);
  if (s.daily) P.rv[id] = Date.now();
  if (kind === 'dunno') {
    s.res[id] = 'dunno';
    markWrong(id);
    save();
    if (!s.flipped) {
      s.flipped = true; s.waitNext = true;
      if (S.set.front === 'zh' && S.set.autoSpeak) pendingSpeak = BY_ID.get(id).w;
      render(); return;
    }
  } else {
    s.res[id] = 'know';
    delete P.star[id];
    save();
  }
  studyAdvance();
}
function studyUndo(){
  const s = session;
  const h = s && s.hist.pop();
  if (!h) return;
  const restore = (obj, k, v) => { if (v) obj[k] = v; else delete obj[k]; };
  restore(P.star, h.id, h.star); restore(P.miss, h.id, h.miss); restore(P.rv, h.id, h.rv); restore(s.res, h.id, h.res);
  if (s.daily && h.dailyDone === false && P.daily) P.daily.done = P.daily.done.filter(x => x !== h.id);
  s.i = h.i; s.flipped = false; s.waitNext = false;
  save(); render();
}
function viewStudy(){
  const s = session;
  if (s.i >= s.list.length) return viewStudyDone();
  const w = curWord(), n = s.list.length;
  const dn = Object.values(s.res).filter(v => v === 'dunno').length;
  const zhFront = S.set.front === 'zh';
  const front = zhFront
    ? `<div class="c-pos">${esc(w.pos)}</div><div class="c-zh big">${esc(w.zh)}</div>`
    : `<div class="c-word">${esc(w.w)}</div><button class="ib say lg" data-act="say" data-id="${w.id}" title="播放發音">${IC.vol}</button>`;
  const back = `<div class="c-word sm">${esc(w.w)}<button class="ib say" data-act="say" data-id="${w.id}" title="播放發音">${IC.vol}</button></div>
    <div class="c-pos">${esc(w.pos)}</div>
    <div class="c-zh">${esc(w.zh)}</div>
    ${w.def ? `<div class="c-def">${esc(w.def)}${HAS_CJK.test(w.def) ? '' : ` <button class="ib say sm" data-act="say-def" data-id="${w.id}" title="唸英英解釋">${IC.vol}</button>`}</div>` : ''}
    ${w.note ? `<div class="c-note">${esc(w.note)}</div>` : ''}`;
  return `
  <div class="sbar">
    <button class="btn ghost sm" data-act="go" data-href="${s.back}">← 返回</button>
    <div class="stitle">${esc(s.title)}</div>
    <div class="scount">${s.i + 1} / ${n}</div>
  </div>
  <div class="progress"><i style="width:${s.i / n * 100}%"></i></div>
  <div class="card${s.flipped ? ' flipped' : ''}" data-act="flip" role="button" tabindex="0" aria-label="翻面">
    ${isStar(w.id) ? `<span class="card-star">${IC.star.replace('width="20" height="20"', 'width="14" height="14"')}不熟</span>` : ''}
    <div class="face">${s.flipped ? back : front}</div>
    ${s.flipped ? '' : '<div class="hint">點一下翻面</div>'}
  </div>
  <div class="sbtns">
    ${s.waitNext
      ? `<button class="btn big primary" data-act="s-next">下一張 →</button>`
      : `<button class="btn big bad" data-act="s-dunno">✗ 不熟</button><button class="btn big ok" data-act="s-know">✓ 記得</button>`}
  </div>
  <div class="sfoot">
    <button class="btn ghost sm" data-act="s-undo"${s.hist.length ? '' : ' disabled'}>↶ 上一張</button>
    <span class="muted kbd-hint">空白鍵 翻面・← 不熟・→ 記得・S 發音</span>
    <span class="muted">本輪不熟 ${dn}</span>
  </div>`;
}
function viewStudyDone(){
  const s = session;
  const dunno = s.list.filter(id => s.res[id] === 'dunno');
  const know = s.list.length - dunno.length;
  let extra = '';
  if (s.daily) {

function qsPool(){
  if (P.qsStar) return starIds();
  return P.qsGroups.flatMap(g => (GW[g] || []).map(w => w.id));

function groupsLabel(gs){
  if (!gs.length) return '';
  if (B.gnames) {
    if (gs.length === NG) return `全部 ${NG} 個主題`;
    if (gs.length <= 2) return gs.map(g => B.gnames[g]).join('、');
    return `${gs.length} 個主題`;
  }
  if (gs.length === 1) return `第 ${pad(gs[0])} 組`;
  if (gs.length === NG) return `全部 ${NG} 組`;
  const contiguous = gs[gs.length - 1] - gs[0] + 1 === gs.length;
  if (contiguous) return `第 ${pad(gs[0])}–${pad(gs[gs.length - 1])} 組`;
  if (gs.length <= 3) return '第 ' + gs.map(pad).join('、') + ' 組';
  return `${gs.length} 組`;
}
function distractors(ans){
  // 依主題分組的單字庫：優先用同主題的術語當干擾選項（比較考得出來有沒有分清楚）
  // 其他單字庫：優先用詞性完全相同的字，避免從詞性猜出答案
  const exact = POS_EXACT[ans.pos] || [];
  const prim = POS_POOL[ans.pos.split('/')[0] || '?'] || [];
  const same = GW[ans.g] || [];
  const tiers = (B.gnames
    ? [same.length >= 6 ? same : null, WORDS]
    : [exact.length >= 12 ? exact : null, prim.length >= 30 ? prim : null, WORDS]).filter(Boolean);
  const out = [], seen = new Set([ans.zh]), seenW = new Set([ans.w]);
  for (const src of tiers) {
    for (let t = 0; out.length < 3 && t < 300; t++) {
      const c = src[Math.random() * src.length | 0];
      if (c.id === ans.id || seen.has(c.zh) || seenW.has(c.w)) continue;
      seen.add(c.zh); seenW.add(c.w); out.push(c.id);
    }
  }
  return out;
}
function startQuiz(pool, type, count, scope, g){
  if (!pool.length) return;
  const ids = shuffle(pool).slice(0, Math.min(count || pool.length, pool.length));
  const qs = ids.map(id => {
    const t = type === 'mix' ? MIX[Math.random() * MIX.length | 0] : type;
    const q = {id, t, answered:false};
    if (t !== 'spell') q.opts = shuffle([id, ...distractors(BY_ID.get(id))]);
    return q;

  session = {kind:'quiz', pool:[...pool], type, count, scope, g:g || null, qs, i:0, correct:0, wrong:[]};

}

/* ---------- 單字庫：解析貼上的內容 ---------- */
const POS_TOKEN = '(?:n|v|vt|vi|adj|adv|prep|conj|pron|int|interj|art|aux|num|det|abbr|phr|ph|a)\\.?';
const POS_RE = new RegExp(`^${POS_TOKEN}(?:\\s*[/&,]\\s*${POS_TOKEN})*$`, 'i');
const POS_LEAD = new RegExp(`^(${POS_TOKEN}(?:\\s*[/&,]\\s*${POS_TOKEN})*)\\s+(.+)$`, 'i');
const HAS_CJK = /[぀-ヿ㐀-鿿豈-﫿]/;
const SPACE_SPLIT = /^(.+?)\s+((?:[a-z]+\.\s*)?[぀-ヿ㐀-鿿].*)$/i;
function cleanCell(c){
  return String(c).replace(/<br\s*\/?>|<\/(?:div|p|li)>/gi, '\n').replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
}
function splitCSV(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function parseBankText(text){
  const lines = String(text).replace(/^﻿/, '').split(/\r\n|\n|\r/);
  const tab = lines.some(l => l.includes('\t'));
  const words = [], skipped = [], seen = new Set();
  let dup = 0;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    let cells = tab ? raw.split('\t') : (line.includes(',') ? splitCSV(line) : [line]);
    cells = cells.flatMap(c => cleanCell(c).split('\n'))
      .map(c => c.trim().replace(/^"(.*)"$/, '$1').trim())
      .filter(c => c && !/^\d+$/.test(c));
    if (!cells.length) continue;
    if (!words.length && /^(word|words|english|term|vocabulary|英文|單字|單詞|排名)$/i.test(cells[0])) continue; // 標題列
    const m0 = cells[0].match(SPACE_SPLIT);
    if (m0 && (cells.length === 1 || HAS_CJK.test(cells[0]))) cells = [m0[1].trim(), m0[2].trim(), ...cells.slice(1)];
    const w = cells[0];
    if (cells.length < 2 || !/[a-z]/i.test(w) || HAS_CJK.test(w)) { skipped.push(line); continue; }
    const rest = cells.slice(1);
    let pos = rest.find(c => POS_RE.test(c)) || '';
    const others = rest.filter(c => c !== pos);
    let zh = '', def = '';
    const zi = others.findIndex(c => HAS_CJK.test(c));
    if (zi >= 0) zh = others.splice(zi, 1)[0]; else if (others.length) zh = others.shift();
    if (zh && !pos) { const m = zh.match(POS_LEAD); if (m) { pos = m[1]; zh = m[2]; } }
    const di = others.findIndex(c => !HAS_CJK.test(c) && /[a-z]/i.test(c) && c.length > 2);
    if (di >= 0) def = others[di];
    if (!zh) { skipped.push(line); continue; }
    const k = w.toLowerCase();
    if (seen.has(k)) { dup++; skipped.push(line); continue; }
    seen.add(k);
    words.push([w.slice(0, 80), pos.slice(0, 20), zh.slice(0, 200), def.slice(0, 300)]);
  }
  return {words, skipped, dup};
}
function decodeText(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  try { return new TextDecoder('utf-8', {fatal:true}).decode(u8).replace(/^﻿/, ''); } catch (e) {}
  try { return new TextDecoder('big5').decode(u8); } catch (e) {}  // Excel 存的 CSV 常是 Big5
  return new TextDecoder().decode(u8);
}

    <div class="form-grid">
      <label class="field"><span>名稱</span><input id="bkName" type="text" placeholder="例如：多益片語、課本第 3 課" value="${esc(draft.name)}" maxlength="40"></label>
      <label class="field"><span>每組幾個字</span><select id="bkSize">${[10, 20, 25, 30, 50, 100].map(n => `<option value="${n}"${draft.size === n ? ' selected' : ''}>${n} 個</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>單字內容（貼上，或選擇檔案）</span>
      <textarea id="bkText" rows="8" spellcheck="false" placeholder="apple&#9;n.&#9;蘋果&#10;take off&#9;v.&#9;起飛&#9;to leave the ground&#10;reservation, n., 預約；訂位&#10;deadline 截止期限">${esc(draft.text)}</textarea>
    </label>
    <div class="actions" style="margin:0 0 6px;align-items:center"><label class="btn sm" for="bkFile">選擇檔案（.csv／.txt）</label><input type="file" id="bkFile" accept=".csv,.tsv,.txt,text/plain,text/csv" hidden><span class="muted small" id="bkFileName"></span></div>
    <div id="bkPreview">${previewHtml()}</div>
    <div class="actions"><button class="btn primary" data-act="bank-create" id="bkCreate"${can ? '' : ' disabled'}>建立單字庫</button></div>
    <details class="help"><summary>格式說明</summary>
      <ul>
        <li>每行一個單字。欄位之間用 Tab 或逗號隔開，也可以只用空格隔開英文和中文。</li>
        <li>欄位順序：<b>英文、詞性、中文、英英解釋</b>。只有英文和中文是必填，詞性和英英解釋可以省略。</li>
        <li>最快的方法：在 Excel 選取這幾欄 → 複製 → 貼到上面的框框。</li>
        <li>也可以直接選 Anki、Quizlet 匯出的文字檔，或 Excel 另存的 CSV 檔。</li>
        <li>第一欄如果是數字（例如排名）會自動略過；重複的英文單字只保留第一個。</li>
      </ul>
      <pre>apple	n.	蘋果	a round fruit
take off	v.	起飛
reservation, n., 預約；訂位
deadline 截止期限</pre>
    </details>
    <p class="muted small" style="margin:12px 0 0">${Sync.user ? '已開啟雲端同步，新增的單字庫會自動出現在你其他登入的裝置。' : '新增的單字庫存在這台裝置的瀏覽器裡。到「設定」用 Google 登入雲端同步，就能在手機和電腦都看到；或用「匯出進度」把檔案帶到另一台匯入。'}</p>
  </section>`;
}

/* ---------- 設定 ---------- */
function viewSettings(){
  const vs = TTS.voices;
  const cur = TTS.pick();
  return `
  <h2 style="margin-bottom:14px">設定</h2>
  ${syncPanelHtml()}
  <section class="panel"><h3>單字庫</h3>
    <div class="actions" style="margin:0;align-items:center"><span>目前使用：<b>${esc(B.name)}</b></span><a class="btn sm" href="#/banks">切換／新增單字庫</a></div>
  </section>
  <section class="panel"><h3>發音</h3>
    ${!TTS.ok ? '<p class="warn">這個瀏覽器不支援語音播放，請改用 Microsoft Edge、Google Chrome 或 Safari。</p>'
      : !vs.length ? '<p class="warn">找不到英文語音。電腦建議用 Microsoft Edge（內建自然語音），或到 Windows「設定 → 時間與語言 → 語音」新增英文語音；手機請確認系統有英文語音。</p>' : ''}
    <label class="field"><span>聲音</span>
      <select id="setVoice" data-set="voice"><option value="">自動選擇（推薦）</option>${vs.map(v => `<option value="${esc(v.voiceURI)}"${S.set.voice === v.voiceURI ? ' selected' : ''}>${esc(v.name)}（${esc(v.lang)}）</option>`).join('')}</select>
    </label>
    <label class="field"><span>語速：<b id="rateVal">${(+S.set.rate).toFixed(2)}×</b></span>
      <input id="setRate" type="range" min="0.5" max="1.3" step="0.05" value="${S.set.rate}" data-set="rate">
    </label>
    <div class="actions" style="margin-top:0;align-items:center"><button class="btn" data-act="say-test">${IC.vol} 試聽</button><span class="muted small" id="voiceNow">目前使用：${esc(cur ? cur.name : '系統預設')}</span></div>
    <label class="check"><input type="checkbox" data-set="autoSpeak"${S.set.autoSpeak ? ' checked' : ''}> 閃卡換到新單字時自動唸（正面中文時，翻面才唸）</label>
    <label class="check"><input type="checkbox" data-set="quizSpeak"${S.set.quizSpeak ? ' checked' : ''}> 考試作答後自動唸出答案</label>
  </section>
  <section class="panel"><h3>今日複習</h3>
    <label class="field"><span>每天複習幾個不熟的單字</span>
      <select id="setDaily" data-set="dailyN">${[5, 10, 15, 20, 30].map(n => `<option value="${n}"${+S.set.dailyN === n ? ' selected' : ''}>${n} 個</option>`).join('')}</select>
    </label>
    <p class="muted small" style="margin:0">從不熟單字裡，優先挑最久沒在今日複習出現過、錯最多次的。在今日複習按「記得」會把單字移出不熟清單。</p>
  </section>
  <section class="panel"><h3>進度備份</h3>
    <p class="muted small" style="margin-top:0">${Sync.user ? '已開啟雲端同步，進度會自動備份到你的 Google 帳號。這裡的匯出是額外的檔案備份。' : '進度和自己新增的單字庫都存在這個瀏覽器裡。換手機、換瀏覽器或清除瀏覽資料前，先匯出備份，之後在新的地方匯入就能接著用（或在上面登入雲端同步）。'}</p>
    <div class="actions" style="margin-bottom:0"><button class="btn" data-act="export">匯出進度</button><button class="btn" data-act="import">匯入進度</button><button class="btn danger" data-act="reset">清除「${esc(B.name)}」的進度</button></div>
  </section>
  <section class="panel"><h3>鍵盤快捷鍵</h3>
    <dl class="keys">
      <dt>閃卡</dt><dd>空白鍵／Enter 翻面　← 或 1 不熟　→ 或 2 記得　Backspace 上一張　S 發音</dd>
      <dt>考試</dt><dd>1–4 選答案　Enter 下一題　S 發音（作答後）</dd>

}
function exportData(){
  const data = {app:'vocab-trainer', v:2, exported:new Date().toISOString(), state:S, banks:CUSTOM};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `單字練習備份_${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let s, newS, newBanks = null;
    try {
      s = JSON.parse(decodeText(r.result));
      if (s && s.v === 2 && s.state) { newS = mergeState(s.state); newBanks = Array.isArray(s.banks) ? s.banks.filter(b => b && b.id && b.name && Array.isArray(b.words)) : []; }
      else if (s && typeof s.star === 'object') newS = mergeState(s);
      else throw 0;
    } catch (e) { alert('這個檔案不是單字練習的備份檔，無法匯入。'); return; }
    if (!confirm('匯入會用備份檔取代目前的進度，確定嗎？')) return;
    if (newBanks) {
      const ids = new Set(newBanks.map(b => b.id));
      CUSTOM = [...CUSTOM.filter(b => !ids.has(b.id)), ...newBanks];
      if (!saveCustom()) { alert('儲存空間不足，單字庫沒有全部匯入。'); }
    }
    S = newS; useBank(S.cur); save();
    alert('匯入完成！'); go('#/');
  };
  r.readAsArrayBuffer(file);
}

/* ---------- 事件 ---------- */
function toggleStar(id){
  const on = !isStar(id);
  if (on) P.star[id] = Date.now(); else delete P.star[id];
  save();
  document.querySelectorAll(`[data-act="star"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    const row = b.closest('.row'); if (row) row.classList.toggle('starred', on);
  });
  updateCounts();
}
const ACT = {
  go: t => go(t.dataset.href),
  say: t => { const w = BY_ID.get(+t.dataset.id); if (w) TTS.say(w.w); },
  'say-def': t => { const w = BY_ID.get(+t.dataset.id); if (w && w.def) TTS.say(w.def); },
  'say-test': () => TTS.say('Welcome! Reservation, invoice, brochure.'),
  star: t => toggleStar(+t.dataset.id),
  reveal: t => t.classList.toggle('shown'),
  gfilter: t => { groupFilter = t.dataset.v; render(); },
  rsort: t => { reviewSort = t.dataset.v; render(); },
  setfront: t => { S.set.front = t.dataset.v; save(); render(); },
  'clear-stars': () => { if (confirm('確定要清除全部不熟標記嗎？錯誤次數紀錄會保留。')) { P.star = {}; save(); render(); } },

  'study-group': t => { const g = +t.dataset.g; startStudy(GW[g].map(w => w.id), gName(g), `#/group/${g}`, {g, full:true}); },
  'study-group-star': t => { const g = +t.dataset.g; startStudy(GW[g].filter(w => isStar(w.id)).map(w => w.id), `${gName(g)}・不熟`, `#/group/${g}`, {g}); },
  'study-review': () => startStudy(reviewList().map(w => w.id), '不熟單字', '#/review'),
  'daily-study': () => {
    const left = dailyLeft();
    startStudy(left.length ? left : ensureDaily().ids, '今日複習', '#/', {daily:true});
  },
  'daily-quiz': () => { const d = ensureDaily(); startQuiz(d.ids, S.set.qsType, 0, '今日複習', null); },
  'daily-more': () => {
    const d = ensureDaily();
    const more = pickDaily(d.ids, S.set.dailyN || 10);
    if (!more.length) return;
    d.ids.push(...more); save();
    startStudy(more, '今日複習・加碼', '#/', {daily:true});
  },
  flip: () => studyFlip(),
  's-know': () => studyMark('know'),
  's-dunno': () => studyMark('dunno'),
  's-next': () => studyAdvance(),
  's-undo': () => studyUndo(),
  's-redo-dunno': () => { const s = session; startStudy(s.list.filter(id => s.res[id] === 'dunno'), s.base + '・不熟重練', s.back, {g:s.g, base:s.base, daily:s.daily}); },
  's-restart': () => { const s = session; startStudy(s.all, s.title, s.back, {g:s.g, full:s.full, base:s.base, daily:s.daily}); },

  'quiz-group': t => { P.qsStar = false; P.qsGroups = [+t.dataset.g]; save(); go('#/quiz'); },
  'quiz-star': () => { P.qsStar = true; save(); go('#/quiz'); },
  'qs-star': () => { P.qsStar = !P.qsStar; save(); render(); },
  'qs-group': t => {
    const g = +t.dataset.g;
    const set = new Set(P.qsStar ? [] : P.qsGroups);
    if (set.has(g)) set.delete(g); else set.add(g);
    P.qsStar = false; P.qsGroups = [...set].sort((a, b) => a - b); save(); render();
  },
  'qs-all': () => { P.qsStar = false; P.qsGroups = Array.from({length:NG}, (_, i) => i + 1); save(); render(); },
  'qs-none': () => { P.qsStar = false; P.qsGroups = []; save(); render(); },
  'qs-done': () => { P.qsStar = false; P.qsGroups = Object.keys(P.done).map(Number).filter(g => g <= NG).sort((a, b) => a - b); save(); render(); },
  'qs-type': t => { S.set.qsType = t.dataset.v; save(); render(); },
  'qs-count': t => { S.set.qsCount = +t.dataset.v; save(); render(); },
  'quiz-start': () => {
    const pool = qsPool();
    if (!pool.length) return;
    const scope = P.qsStar ? '不熟單字' : groupsLabel(P.qsGroups);
    const g = !P.qsStar && P.qsGroups.length === 1 ? P.qsGroups[0] : null;
    startQuiz(pool, S.set.qsType, S.set.qsCount, scope, g);
  },
  pick: t => { const z = session, q = z.qs[z.i]; if (q.answered) return; const oid = q.opts[+t.dataset.k]; quizAnswer(oid === q.id, {picked:oid}); },
  'spell-giveup': () => quizAnswer(false, {input:''}),
  'q-next': () => quizNext(),
  'q-quit': () => { if (confirm('結束這次考試？成績不會被記錄（已答錯的單字仍會留在不熟清單）。')) { session = null; go('#/quiz'); } },
  'q-retry-wrong': () => { const z = session; startQuiz([...new Set(z.wrong)], z.type, 0, z.scope.replace(/・錯題重考$/, '') + '・錯題重考', null); },
  'q-study-wrong': () => { const z = session; startStudy([...new Set(z.wrong)], '考試錯題', '#/quiz'); },
  'q-again': () => { const z = session; startQuiz(z.pool, z.type, z.count, z.scope, z.g); },

  'bank-use': t => { useBank(t.dataset.b); save(); go('#/'); },
  'bank-del': t => {
    const id = t.dataset.b, b = CUSTOM.find(x => x.id === id);
    if (!b || !confirm(`刪除「${b.name}」？這個單字庫和它的學習進度會一起刪除，無法復原。`)) return;
    CUSTOM = CUSTOM.filter(x => x.id !== id); saveCustom();
    delete S.banks[id];
    if (B.id === id) useBank(BUILTIN[0].id);
    save(); render();
  },
  'bank-create': () => {
    refreshDraft();
    const p = draft.parsed;
    if (!p || !p.words.length) return;
    const name = draft.name.trim() || `我的單字庫 ${CUSTOM.length + 1}`;
    const b = {id:'c' + Date.now().toString(36), name, size:draft.size, words:p.words, created:Date.now()};
    CUSTOM.push(b);
    if (!saveCustom()) { CUSTOM.pop(); alert('瀏覽器的儲存空間不夠，沒辦法建立。可以把單字庫拆小一點再試。'); return; }
    draft = {name:'', size:50, text:'', parsed:null};
    useBank(b.id); save(); go('#/');
  },

  'sync-login': () => Sync.signIn(),
  'sync-logout': () => Sync.signOut(),
  'sync-now': () => Sync.syncNow(),
  export: () => exportData(),
  import: () => $('#importFile').click(),
  reset: () => {
    if (!confirm(`清除「${B.name}」的所有進度？不熟標記、學過紀錄、考試成績都會刪除，無法復原。建議先匯出備份。`)) return;
    S.banks[B.id] = bankDefaults(); useBank(B.id); save(); render();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACT[t.dataset.act];
  if (f) { if (t.tagName === 'A') e.preventDefault(); f(t, e); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form !== 'spell') return;
  e.preventDefault();
  const z = session, q = z && z.qs[z.i];
  if (!q || q.answered) return;
  const inp = f.querySelector('input');
  const v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  quizAnswer(spellAnswers(BY_ID.get(q.id)).includes(norm(v)), {input:v});
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile') { importData(t.files[0]); t.value = ''; return; }
  if (t.id === 'reviewGroup') { reviewGroup = +t.value || 0; render(); return; }
  if (t.id === 'bkSize') { draft.size = +t.value; refreshDraft(); return; }
  if (t.id === 'bkFile') {
    const file = t.files[0]; t.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      draft.text = decodeText(r.result);
      if (!draft.name.trim()) draft.name = file.name.replace(/\.[^.]+$/, '').slice(0, 40);
      const ta = $('#bkText'), nm = $('#bkName'), fn = $('#bkFileName');
      if (ta) ta.value = draft.text;
      if (nm) nm.value = draft.name;
      if (fn) fn.textContent = file.name;
      refreshDraft();
    };
    r.readAsArrayBuffer(file);
    return;
  }
  const k = t.dataset.set;
  if (!k) return;
  let v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.value;
  if (k === 'dailyN') v = +v;
  S.set[k] = v; save();
  if (k === 'hideZh') render();
  if (k === 'dailyN') ensureDaily();
  if (k === 'voice') {
    const el = $('#voiceNow'), cur = TTS.pick();
    if (el) el.textContent = '目前使用：' + (cur ? cur.name : '系統預設');
    TTS.say('vacation');
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { doSearch(t.value); return; }
  if (t.id === 'bkName') { draft.name = t.value; return; }
  if (t.id === 'bkText') { draft.text = t.value; clearTimeout(draftTimer); draftTimer = setTimeout(refreshDraft, 250); return; }
  if (t.dataset.set === 'rate') {
    S.set.rate = +t.value; save();
    const el = $('#rateVal'); if (el) el.textContent = (+t.value).toFixed(2) + '×';
  }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName || '';
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  const k = e.key;
  if ((k === 'Enter' || k === ' ') && (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY')) return; // 交給按鈕本身
  if (e.repeat && (k === 'Enter' || k === ' ')) return;
  const r = route();
  if (r.a === 'study' && session && session.kind === 'study') {
    const s = session;
    if (s.i >= s.list.length) return;
    if (k === ' ' || k === 'Enter') { e.preventDefault(); studyFlip(); }
    else if (k === 'ArrowLeft' || k === '1') { e.preventDefault(); studyMark('dunno'); }
    else if (k === 'ArrowRight' || k === '2') { e.preventDefault(); studyMark('know'); }
    else if (k === 'Backspace' || k === 'z' || k === 'Z') { e.preventDefault(); studyUndo(); }
    else if (k === 's' || k === 'S' || k === 'p' || k === 'P') { TTS.say(curWord().w); }
  } else if (r.a === 'test' && session && session.kind === 'quiz') {
    const z = session;
    if (z.i >= z.qs.length) return;
    const q = z.qs[z.i];
    if (!q.answered && q.opts && /^[1-4]$/.test(k) && q.opts[+k - 1]) { e.preventDefault(); const oid = q.opts[+k - 1]; quizAnswer(oid === q.id, {picked:oid}); }
    else if (q.answered && (k === 'Enter' || k === ' ' || k === 'ArrowRight')) { e.preventDefault(); quizNext(); }
    else if ((k === 's' || k === 'S' || k === 'p' || k === 'P') && canSpeakQ(q)) { TTS.say(BY_ID.get(q.id).w); }
  }
});

useBank(S.cur);
Sync.initLocal();
render();
Sync.init();
})();
</script>
